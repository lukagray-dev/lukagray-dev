name: Generate GitHub Stats SVGs

on:
  schedule:
    # Runs every day at 1 AM UTC
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate github-readme-stats (Stats Card)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lukagray-dev
          template: classic
          base: header, activity, community, repositories
          config_timezone: Asia/Kolkata
          filename: assets/stats.svg
          config_output: svg
          repositories_forks: yes

      - name: Generate github-readme-stats (Languages Card)
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: lukagray-dev
          template: classic
          base: ""
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 6
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_indepth: no
          filename: assets/langs.svg
          config_output: svg

      - name: Commit generated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg
          git diff --cached --quiet || git commit -m "chore: update stats SVGs [skip ci]"
          git push
